baseURL: https://phychi.github.io/
title: Phychi 的博客
theme: PaperMod
locale: zh-cn
defaultContentLanguage: zh
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true
enableGitInfo: false

pagination:
  pagerSize: 10

params:
  env: production
  description: Phychi 的个人博客
  author: phychi
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  homeInfoParams:
    Title: "你好，我是 Phychi 👋"
    Content: "这里记录学习、思考与生活。"

  socialIcons:
    - name: github
      url: https://github.com/phychi
    - name: rss
      url: index.xml

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys:
      - title
      - permalink
      - summary
      - content

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 2
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 3
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 4
    - identifier: search
      name: 搜索
      url: /search/
      weight: 5
    - identifier: about
      name: 关于
      url: /about/
      weight: 6

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: false
